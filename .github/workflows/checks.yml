name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install '.[study]'
      - run: make test
      - name: Test the installed package
        run: |
          cd /tmp
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Independent differential against installed engine
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/differential.py" "$GITHUB_WORKSPACE/examples/recorded.csv" --out /tmp/differential.json
      - run: queuecraft simulate examples/recorded.csv --size 25 --policy twap --recording-metadata examples/recorded-provenance.json --out /tmp/order
      - run: queuecraft verify /tmp/order
      - name: Installed consumer outside checkout
        run: |
          cp examples/strategy.py /tmp/consumer.py
          cp examples/recorded.csv /tmp/recorded.csv
          cd /tmp
          python consumer.py recorded.csv 25
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
