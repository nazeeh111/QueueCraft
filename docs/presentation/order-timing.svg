<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="order-False-title order-False-desc"><title id="order-False-title">One order, two arrival assumptions</title><desc id="order-False-desc">A synthetic depth update changes fill allocation and exact cash for a seven-lot sell; both saved results replay exactly.</desc><rect width="100%" height="100%" fill="#f5f4ef"/><text x="28" y="36" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#175da0" font-weight="700">QUEUECRAFT / SYNTHETIC EXECUTION</text><text x="28" y="80" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#142d42" font-weight="700">Arrival changes the account.</text><text x="28" y="112" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#142d42">Same book, order and fee rule. Only modeled latency changes.</text><line x1="90" y1="240" x2="1080" y2="240" stroke="#142d42"/><circle data-ms="0" cx="90" cy="240" r="6" fill="#142d42"/><circle data-ms="50" cx="990" cy="240" r="6" fill="#142d42"/><circle data-ms="55" cx="1080" cy="240" r="6" fill="#a34b19"/><text x="64" y="190" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#142d42" font-weight="700">0 ms / decision</text><text x="64" y="216" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#465d6d">Sell 7 from the initial book.</text><line x1="90" y1="222" x2="90" y2="234" stroke="#b9c8ce"/><text x="746" y="178" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#142d42" font-weight="700">50 ms / recorded update</text><text x="746" y="204" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#465d6d">100-tick bid: 4 lots to 2.</text><line x1="990" y1="213" x2="990" y2="234" stroke="#b9c8ce"/><text x="872" y="292" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#a34b19" font-weight="700">55 ms / delayed arrival</text><text x="872" y="317" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#465d6d">Uses the updated depth.</text><line x1="1080" y1="246" x2="1080" y2="270" stroke="#b9c8ce"/><text x="28" y="372" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#175da0" font-weight="700">FILL ALLOCATION / 1 BLOCK = 1 LOT</text><text x="28" y="418" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#142d42" font-weight="700">0 ms arrival</text><rect data-case="0" data-price="100" data-lot="0" x="210" y="433" width="64" height="44" fill="#175da0"/><text x="242.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="0" data-price="100" data-lot="1" x="278" y="433" width="64" height="44" fill="#175da0"/><text x="310.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="0" data-price="100" data-lot="2" x="346" y="433" width="64" height="44" fill="#175da0"/><text x="378.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="0" data-price="100" data-lot="3" x="414" y="433" width="64" height="44" fill="#175da0"/><text x="446.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="0" data-price="99" data-lot="4" x="482" y="433" width="64" height="44" fill="#142d42"/><text x="514.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="0" data-price="99" data-lot="5" x="550" y="433" width="64" height="44" fill="#142d42"/><text x="582.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="0" data-price="99" data-lot="6" x="618" y="433" width="64" height="44" fill="#142d42"/><text x="650.0" y="461" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><text x="746" y="456" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d42" font-weight="700">Gross 697 - fees 2 = cash 695</text><text x="746" y="484" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#465d6d">Inventory -7 lots; all 7 filled.</text><text x="28" y="523" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#142d42" font-weight="700">55 ms arrival</text><rect data-case="1" data-price="100" data-lot="0" x="210" y="538" width="64" height="44" fill="#175da0"/><text x="242.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="1" data-price="100" data-lot="1" x="278" y="538" width="64" height="44" fill="#175da0"/><text x="310.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">100</text><rect data-case="1" data-price="99" data-lot="2" x="346" y="538" width="64" height="44" fill="#142d42"/><text x="378.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="1" data-price="99" data-lot="3" x="414" y="538" width="64" height="44" fill="#142d42"/><text x="446.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="1" data-price="99" data-lot="4" x="482" y="538" width="64" height="44" fill="#142d42"/><text x="514.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="1" data-price="99" data-lot="5" x="550" y="538" width="64" height="44" fill="#142d42"/><text x="582.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><rect data-case="1" data-price="99" data-lot="6" x="618" y="538" width="64" height="44" fill="#142d42"/><text x="650.0" y="566" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="white">99</text><text x="746" y="561" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#142d42" font-weight="700">Gross 695 - fees 2 = cash 693</text><text x="746" y="589" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#465d6d">Inventory -7 lots; all 7 filled.</text><line x1="28" y1="628" x2="1172" y2="628" stroke="#b9c8ce"/><text x="28" y="652" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#465d6d">Ticks and lots, not dollars. Fees ceil per fill at 100 ppm.</text><text x="28" y="677" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#465d6d">Synthetic capture time; no live orders or latency measurement.</text></svg>