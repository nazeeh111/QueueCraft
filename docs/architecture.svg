<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">QueueCraft architecture</title><desc id="d">Original archive passes through normalization to a C++ book. A delayed Python strategy schedules orders into the book, producing an exact ledger checked independently.</desc><rect width="960" height="400" fill="#f5f4ef"/><g font-family="system-ui,sans-serif"><rect x="20" y="60" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="38" y="102" font-size="22" fill="#142d42">Original archive</text><text x="38" y="137" font-size="15" fill="#465d6d">pinned bytes + attribution</text><rect x="330" y="60" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="348" y="102" font-size="22" fill="#142d42">Normalization</text><text x="348" y="137" font-size="15" fill="#465d6d">label-free S / G records</text><rect x="640" y="60" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="658" y="102" font-size="22" fill="#142d42">C++ book</text><text x="658" y="137" font-size="15" fill="#465d6d">atomic state + consumption</text><rect x="640" y="240" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="658" y="282" font-size="22" fill="#142d42">Python strategy SDK</text><text x="658" y="317" font-size="15" fill="#465d6d">delayed observations + arrivals</text><rect x="330" y="240" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="348" y="282" font-size="22" fill="#142d42">Exact ledger</text><text x="348" y="317" font-size="15" fill="#465d6d">signed cash + inventory</text><rect x="20" y="240" width="280" height="110" rx="3" fill="white" stroke="#8aa0ae"/><text x="38" y="282" font-size="22" fill="#142d42">Independent checks</text><text x="38" y="317" font-size="15" fill="#465d6d">Python traces + DuckDB SQL</text></g><g stroke="#175da0" stroke-width="3" fill="none"><path d="M300 115H330m310 0h0M610 115H640M780 170V240M640 295H610M330 295H300"/></g><text x="24" y="380" font-family="monospace" font-size="14" fill="#175da0">QUEUECRAFT / EXACT REPLAY / ASSUMPTIONS VISIBLE</text></svg>
